# Publishes a GitHub Release. Installed Watchtower apps pull it via electron-updater.
#
# - Push tag v1.0.0 → release 1.0.0
# - Every push to main → patch bump, tag, publish (installed PCs auto-update)
# - Actions → Release → Run workflow for a manual bump

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump package version before release'
        required: false
        default: 'patch'
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish Windows update
    runs-on: windows-latest
    # Avoid re-entry when the release job pushes a version commit with [skip ci]
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run prepare:server
      - run: npm test

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Bump on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.event.inputs.bump }}" != "none" ]; then
            npm version "${{ github.event.inputs.bump }}" --no-git-tag-version
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Auto version on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERSION == ''
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Version from package.json
        if: env.VERSION == ''
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Skip if this version was already released
        id: exists
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to GitHub Releases
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish

      - name: Commit version + tag on main
        if: steps.exists.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION} [skip ci]" || true
          git tag "v${VERSION}" || true
          git push origin HEAD:main --follow-tags || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: steps.exists.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-${{ env.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
